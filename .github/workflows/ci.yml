name: CI
on:
  push:
    paths:
      - 'rules/**'
  pull_request:
    paths:
      - 'rules/**'

permissions:
  contents: read

jobs:
  process-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Find changed rules
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            FILES=$(ls rules/*.yml 2>/dev/null)
          else
            # A = added, M = modified; skipping deleted files
            FILES=$(git diff --name-only --diff-filter=AM "$BASE" "$GITHUB_SHA" -- 'rules/*.yml')
          fi
          echo "Changed rules: $FILES"
          {
            echo "files<<EOF"
            echo "$FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check and convert rules
        if: steps.changed.outputs.files != ''
        env:
          FILES: ${{ steps.changed.outputs.files }}
        run: echo "$FILES" | xargs -d '\n' python scripts/process_rules.py

      - name: Save output
        if: always() && steps.changed.outputs.files != ''
        uses: actions/upload-artifact@v4
        with:
          name: converted-rules
          path: out/
