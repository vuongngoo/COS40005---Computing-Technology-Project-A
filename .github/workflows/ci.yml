name: CI
on:
  push:
    paths:
      - 'rules/**'
  pull_request:
    paths:
      - 'rules/**'

permissions:
  contents: read

jobs:
  process-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Check and convert rules
        run: python scripts/process_rules.py

      - name: Save output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: converted-rules
          path: out/
