name: CI
on:
  push:
    branches: [main]
    paths:
      - 'rules/**'
  pull_request:
    paths:
      - 'rules/**'

permissions:
  contents: read

jobs:
  process-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml pysigma

      - name: Find changed rules
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            FILES=$(ls rules/*.yml 2>/dev/null)
          else
            # A = added, M = modified; skipping deleted files
            FILES=$(git diff --name-only --diff-filter=AM "$BASE" "$GITHUB_SHA" -- 'rules/*.yml')
          fi
          echo "Changed rules: $FILES"
          {
            echo "files<<EOF"
            echo "$FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check and convert rules
        if: steps.changed.outputs.files != ''
        env:
          FILES: ${{ steps.changed.outputs.files }}
        run: echo "$FILES" | xargs -d '\n' python scripts/process_rules.py

      - name: Convert to Wazuh
        if: steps.changed.outputs.files != ''
        env:
          FILES: ${{ steps.changed.outputs.files }}
        run: echo "$FILES" | xargs -d '\n' python scripts/convert_wazuh.py

      - name: Save output
        if: always() && steps.changed.outputs.files != ''
        uses: actions/upload-artifact@v4
        with:
          name: converted-rules
          path: out/

  automerge:
    needs: process-rules
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Enable auto-merge
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"

  deploy:
    needs: process-rules
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest  
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml pysigma

      - name: Validate and convert ALL rules
        run: |
          python scripts/process_rules.py
          python scripts/convert_wazuh.py

      - name: Dry run (testing mode, nothing is sent to Wazuh)
        if: vars.WAZUH_DEPLOY != 'true'
        run: |
          echo "Dry run: this bundle would be deployed to /var/ossec/etc/rules/sigma_rules.xml"
          ls -l out/converted/
          head -50 out/converted/sigma_rules_bundle.xml

      - name: Save bundle for inspection
        if: vars.WAZUH_DEPLOY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wazuh-bundle-dry-run
          path: out/converted/sigma_rules_bundle.xml

      - name: Deploy bundle to Wazuh manager
        if: vars.WAZUH_DEPLOY == 'true'
        env:
          SSH_KEY: ${{ secrets.WAZUH_SSH_KEY }}
          WAZUH_USER: ${{ secrets.WAZUH_USER }}
          WAZUH_HOST: ${{ secrets.WAZUH_HOST }}
        run: |
          install -m 600 /dev/null key
          printf '%s\n' "$SSH_KEY" > key
          SSH="ssh -i key -o StrictHostKeyChecking=accept-new"

          scp -i key -o StrictHostKeyChecking=accept-new \
            out/converted/sigma_rules_bundle.xml \
            "$WAZUH_USER@$WAZUH_HOST:/tmp/sigma_rules.xml"

          $SSH "$WAZUH_USER@$WAZUH_HOST" '
            set -e
            RULES=/var/ossec/etc/rules/sigma_rules.xml
            [ -f "$RULES" ] && cp "$RULES" "$RULES.bak"
            cp /tmp/sigma_rules.xml "$RULES"
            if /var/ossec/bin/wazuh-analysisd -t; then
              systemctl restart wazuh-manager
            else
              echo "Rule test failed, restoring previous rules"
              [ -f "$RULES.bak" ] && cp "$RULES.bak" "$RULES"
              exit 1
            fi
          '
