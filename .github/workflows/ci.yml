name: CI
on:
  push:
    branches: [main]
    paths:
      - 'rules/**'
  pull_request:
    paths:
      - 'rules/**'

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # 1. Checks (runs on every PR and on every push to main)
  #    This job name ("process-rules") is what you mark as a
  #    required status check in branch protection.
  # ---------------------------------------------------------------
  process-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml pysigma

      - name: Find changed rules
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            FILES=$(ls rules/*.yml 2>/dev/null)
          else
            # A = added, M = modified; skipping deleted files
            FILES=$(git diff --name-only --diff-filter=AM "$BASE" "$GITHUB_SHA" -- 'rules/*.yml')
          fi
          echo "Changed rules: $FILES"
          {
            echo "files<<EOF"
            echo "$FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check and convert rules
        if: steps.changed.outputs.files != ''
        env:
          FILES: ${{ steps.changed.outputs.files }}
        run: echo "$FILES" | xargs -d '\n' python scripts/process_rules.py

      - name: Convert to Wazuh
        if: steps.changed.outputs.files != ''
        env:
          FILES: ${{ steps.changed.outputs.files }}
        run: echo "$FILES" | xargs -d '\n' python scripts/convert_wazuh.py

      # Enable once replay_and_score.py exists (exit 1 if targets are missed)
      # - name: Replay logs and score detection / false-positive rates
      #   if: steps.changed.outputs.files != ''
      #   env:
      #     FILES: ${{ steps.changed.outputs.files }}
      #   run: echo "$FILES" | xargs -d '\n' python scripts/replay_and_score.py

      - name: Save output
        if: always() && steps.changed.outputs.files != ''
        uses: actions/upload-artifact@v4
        with:
          name: converted-rules
          path: out/

  # ---------------------------------------------------------------
  # 2. Auto-merge (PRs only). Turns on auto-merge; GitHub merges
  #    the PR once every required check is green.
  # ---------------------------------------------------------------
  automerge:
    needs: process-rules
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Enable auto-merge
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"

  # ---------------------------------------------------------------
  # 3a. Deploy DRY RUN (default). Runs on a GitHub-hosted runner after a
  #     merge to main. Nothing is sent to Wazuh: it builds the bundle,
  #     prints it and saves it as an artifact.
  #     Rebuilds from ALL rules, because process-rules only converts the
  #     files that changed in this push.
  # ---------------------------------------------------------------
  deploy:
    needs: process-rules
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.WAZUH_DEPLOY != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml pysigma

      - name: Validate and convert ALL rules
        run: |
          python scripts/process_rules.py
          python scripts/convert_wazuh.py

      # FIX: safety net. If convert_wazuh.py did not create the bundle itself,
      # join the per-rule XML files into it. Does nothing if the bundle exists.
      - name: Make sure the bundle exists
        run: |
          if [ ! -s out/wazuh/sigma_rules_bundle.xml ]; then
            echo "Bundle not created by convert script, building it from out/wazuh/*.xml"
            ls out/wazuh/*.xml > /dev/null
            cat out/wazuh/*.xml > /tmp/sigma_rules_bundle.xml
            mv /tmp/sigma_rules_bundle.xml out/wazuh/sigma_rules_bundle.xml
          fi
          test -s out/wazuh/sigma_rules_bundle.xml

      - name: Dry run (testing mode, nothing is sent to Wazuh)
        run: |
          echo "Dry run: this bundle would be deployed to /var/ossec/etc/rules/sigma_rules.xml"
          ls -l out/wazuh/
          head -50 out/wazuh/sigma_rules_bundle.xml

      - name: Save bundle for inspection
        uses: actions/upload-artifact@v4
        with:
          name: wazuh-bundle-dry-run
          path: out/wazuh/sigma_rules_bundle.xml

  # ---------------------------------------------------------------
  # 3b. REAL deploy to a Wazuh manager running in Docker.
  #     Only runs when the repository variable WAZUH_DEPLOY = true.
  #     Runs on a SELF-HOSTED runner installed on the machine that runs
  #     Docker, because GitHub's servers cannot reach a Docker container
  #     on your own computer. Needs no SSH keys or secrets.
  #
  #     Optional repository variable WAZUH_CONTAINER = name of the Wazuh
  #     manager container (default: single-node-wazuh.manager-1).
  #     Check yours with:  docker ps --format "{{.Names}}"
  # ---------------------------------------------------------------
  deploy-wazuh:
    needs: process-rules
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.WAZUH_DEPLOY == 'true'
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install pyyaml pysigma

      - name: Validate and convert ALL rules
        run: |
          .venv/bin/python scripts/process_rules.py
          .venv/bin/python scripts/convert_wazuh.py

      # FIX: same safety net as in the dry-run job (see above).
      - name: Make sure the bundle exists
        run: |
          if [ ! -s out/wazuh/sigma_rules_bundle.xml ]; then
            echo "Bundle not created by convert script, building it from out/wazuh/*.xml"
            ls out/wazuh/*.xml > /dev/null
            cat out/wazuh/*.xml > /tmp/sigma_rules_bundle.xml
            mv /tmp/sigma_rules_bundle.xml out/wazuh/sigma_rules_bundle.xml
          fi
          test -s out/wazuh/sigma_rules_bundle.xml

      - name: Deploy bundle to Wazuh through the API
        env:
          WAZUH_API_URL: ${{ vars.WAZUH_API_URL }}
          WAZUH_API_USER: ${{ secrets.WAZUH_API_USER }}
          WAZUH_API_PASSWORD: ${{ secrets.WAZUH_API_PASSWORD }}
          WAZUH_API_VERIFY_TLS: ${{ vars.WAZUH_API_VERIFY_TLS }}
        run: python3 scripts/deploy_wazuh_api.py out/wazuh/sigma_rules_bundle.xml
