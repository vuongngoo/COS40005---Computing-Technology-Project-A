title: Local User Account Created via net.exe
id: 51742e7e-84a1-458d-8b05-567e8dd90664
status: experimental
description: Detects creation of a local user account with net.exe or net1.exe, which attackers use to maintain access.
references:
    - https://attack.mitre.org/techniques/T1136/001/
    - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1136.001/T1136.001.md
author: Group 7 - CAP-07
date: 2026-10-26
tags:
    - attack.persistence
    - attack.t1136.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith:
            - '\net.exe'
            - '\net1.exe'
    selection_cli:
        CommandLine|contains|all:
            - 'user'
            - '/add'
    condition: selection_img and selection_cli
falsepositives:
    - Administrators creating local accounts, or provisioning scripts
level: medium
