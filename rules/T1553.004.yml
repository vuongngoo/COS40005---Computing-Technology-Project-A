title: Root Certificate Installed via Certutil
id: e4b97678-6ea1-46b6-a6cc-b1efd6490169
status: experimental
description: Detects certutil.exe adding a certificate to a trusted root store, which lets an attacker make malicious certificates trusted.
references:
    - https://attack.mitre.org/techniques/T1553/004/
author: Duy Hoang Nguyen
date: 2026-11-19
tags:
    - attack.defense_evasion
    - attack.t1553.004
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\certutil.exe'
        CommandLine|contains:
            - '-addstore'
            - '/addstore'
    condition: selection
falsepositives:
    - Administrators deploying internal CA certificates
level: high
