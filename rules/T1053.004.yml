title: Scheduled Task Creation via Schtasks
id: 5b8a1c2e-7f3d-4a6b-9c1e-2d4f6a8b0c13
status: experimental
description: Detects schtasks.exe being used to create a scheduled task, a common persistence technique.
references:
    - https://attack.mitre.org/techniques/T1053/005/
author: Nguyen Duy Hoang
date: 2026-11-26
tags:
    - attack.persistence
    - attack.t1053.005
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\schtasks.exe'
    selection_cmd:
        CommandLine|contains: '/create'
    condition: all of selection_*
falsepositives:
    - Software installers and admin scripts creating legitimate tasks
level: medium
