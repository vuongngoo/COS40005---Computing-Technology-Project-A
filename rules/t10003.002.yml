title: Registry Hive Export of SAM, SECURITY or SYSTEM
id: b854fd69-5a99-4896-8cb4-0c595de4cfaa
status: experimental
description: Detects reg.exe saving or exporting the SAM, SECURITY or SYSTEM hives, which is used to extract local credential hashes offline.
references:
    - https://attack.mitre.org/techniques/T1003/002/
author: Group 7 - CAP-07
date: 2026-10-26
tags:
    - attack.credential-access
    - attack.t1003.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\reg.exe'
    selection_action:
        CommandLine|contains:
            - ' save '
            - ' export '
    selection_hive:
        CommandLine|contains:
            - 'hklm\sam'
            - 'hklm\security'
            - 'hklm\system'
    condition: all of selection_*
falsepositives:
    - Backup or forensic tooling run by administrators
level: high
