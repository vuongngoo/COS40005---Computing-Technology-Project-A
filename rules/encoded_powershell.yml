title: PowerShell Encoded Command Execution
id: 1a2b3c4d-0001-4a5b-8c9d-aaaaaaaa0001
status: experimental
description: Detects PowerShell started with an encoded command argument.
author: CAP-07 team
date: 2026-10-23
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains:
      - ' -enc '
      - ' -EncodedCommand '
  condition: selection
falsepositives:
  - Admin scripts that use encoded commands
level: high
