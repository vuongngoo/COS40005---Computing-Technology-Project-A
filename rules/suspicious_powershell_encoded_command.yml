title: Suspicious PowerShell Encoded Command Execution
id: 3c7e8a21-5b94-4d6f-9a12-8e5c0b7d31f4
status: test
description: Detects PowerShell execution using encoded command arguments, which may be used to obfuscate malicious commands.
author: Detection Engineering Team
date: 2026-11-18
tags:
  - attack.execution
  - attack.t1059
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_encoded:
    CommandLine|contains:
      - '-EncodedCommand'
      - '-enc '
      - '-e '
  condition: selection_image and selection_encoded
falsepositives:
  - Legitimate administrative scripts that use encoded PowerShell commands
  - Software deployment and management tools
level: medium
