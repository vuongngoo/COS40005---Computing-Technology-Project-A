title: Shadow Copies Or Backup Catalog Deleted
id: 879eae1c-dc71-44f0-b99a-07c62ce81ded
status: experimental
description: Detects commands that delete Volume Shadow Copies, disable Windows recovery or remove the backup catalog, a common step before ransomware encrypts files (Sysmon Event ID 1).
references:
    - https://attack.mitre.org/techniques/T1490/
author: Group 7 - CAP-07
date: 2026-11-19
tags:
    - attack.impact
    - attack.t1490
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith:
            - '\vssadmin.exe'
            - '\wmic.exe'
            - '\wbadmin.exe'
            - '\bcdedit.exe'
    selection_cli:
        CommandLine|contains:
            - 'delete shadows'
            - 'shadowcopy delete'
            - 'delete catalog'
            - 'recoveryenabled no'
    filter_routine:
        CommandLine|contains: '/oldest'
    condition: selection_img and selection_cli and not filter_routine
falsepositives:
    - Backup software or administrators that delete old shadow copies on purpose (add them to the filter after review)
    - Administrators changing boot recovery settings during maintenance
level: high
