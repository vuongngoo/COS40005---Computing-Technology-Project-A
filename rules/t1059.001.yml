title: Suspicious Parent Process Spawning PowerShell
id: c3f7a8e1-5d2b-4f6a-9e8c-1a2b3c4d5e6f
status: experimental
description: |
    Detects PowerShell being spawned as a child process by applications
    that would not normally launch it — commonly seen when Office macros,
    scripting engines, or scheduled tasks execute PowerShell to download
    or run a malicious payload (T1059.001).
references:
    - https://attack.mitre.org/techniques/T1059/001/
author: Duy Hoang
date: 2026-10-23
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_powershell:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_suspicious_parent:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\powerpnt.exe'
            - '\outlook.exe'
            - '\mshta.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\cmd.exe'
            - '\rundll32.exe'
    filter_legit:
        CommandLine|contains:
            - 'C:\Program Files\'
    condition: selection_powershell and selection_suspicious_parent and not filter_legit
falsepositives:
    - Legitimate macros or scripts in enterprise environments that
      intentionally call PowerShell for automation (e.g. deployment scripts,
      IT admin tooling triggered from cmd.exe)
    - Some third-party installers chain through cmd.exe/rundll32.exe before
      calling PowerShell for update checks
level: high
