title: Registry Run Key Persistence Set
id: 7c1e9a52-4b1d-4f0e-9a3b-2d6f8e5c1a07
status: test
description: Detects a value being set under the Run, RunOnce or Policies\Explorer\Run registry keys, commonly used for persistence at logon.
references:
    - https://attack.mitre.org/techniques/T1547/001/
author: Group 7
date: 2026/10/29
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1547.001
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|contains:
            - '\SOFTWARE\Microsoft\Windows\CurrentVersion\Run\'
            - '\SOFTWARE\Microsoft\Windows\CurrentVersion\RunOnce\'
            - '\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run\'
            - '\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Run\'
    filter_main_installers:
        Image|endswith:
            - '\msiexec.exe'
            - '\TiWorker.exe'
    condition: selection and not 1 of filter_main_*
falsepositives:
    - Legitimate software installers or updaters that register an autorun entry
level: medium
