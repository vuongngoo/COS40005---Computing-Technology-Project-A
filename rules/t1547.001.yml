title: Registry Run Key Persistence Modified
id: 5072272e-2cdf-44e5-95b7-fe6b92d747f4
status: experimental
description: Detects a value being written under the Run or RunOnce registry keys, a common persistence mechanism (Sysmon Event ID 13).
references:
    - https://attack.mitre.org/techniques/T1547/001/
author: Group 7 - CAP-07
date: 2026-10-26
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1547.001
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|contains:
            - '\SOFTWARE\Microsoft\Windows\CurrentVersion\Run\'
            - '\SOFTWARE\Microsoft\Windows\CurrentVersion\RunOnce\'
    filter_programfiles:
        Details|startswith:
            - 'C:\Program Files\'
            - 'C:\Program Files (x86)\'
    condition: selection and not filter_programfiles
falsepositives:
    - Legitimate software installers registering autostart entries
level: medium
