title: Certutil Used To Download A File
id: 1a2b3c4d-0002-4a5b-8c9d-aaaaaaaa0002
status: experimental
description: Detects certutil.exe fetching a remote file with -urlcache.
author: CAP-07 team
date: 2026-10-23
tags:
  - attack.command_and_control
  - attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\certutil.exe'
    CommandLine|contains: '-urlcache'
  condition: selection
falsepositives:
  - Rare legitimate certificate retrieval
level: medium
