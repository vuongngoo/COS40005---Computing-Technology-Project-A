title: CMSTP Proxy Execution with INF File
id: 7bb96fd6-2b05-4fbb-9246-e61ece1367f9
status: experimental
description: Detects cmstp.exe run silently with an INF file, used to execute code or bypass UAC.
references:
  - https://attack.mitre.org/techniques/T1218/003/
author: Group 7
date: '2026-11-27'
tags:
  - attack.defense_evasion
  - attack.t1218.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: \cmstp.exe
    CommandLine|contains:
      - ' /s '
      - /au
      - /ns
  condition: selection
falsepositives:
  - VPN connection profile installation by administrators
level: high
