title: Windows Event Logs Cleared
id: 6cd21e5d-3415-400b-a7e3-967795deedb9
status: experimental
description: Detects wevtutil cl or PowerShell Clear-EventLog used to clear Windows event logs.
references:
  - https://attack.mitre.org/techniques/T1070/001/
author: Group 7
date: '2026-11-27'
tags:
  - attack.defense_evasion
  - attack.t1070.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_wevtutil:
    Image|endswith: \wevtutil.exe
    CommandLine|contains:
      - ' cl '
      - ' clear-log '
  selection_ps:
    Image|endswith:
      - \powershell.exe
      - \pwsh.exe
    CommandLine|contains: clear-eventlog
  condition: selection_wevtutil or selection_ps
falsepositives:
  - Administrators clearing logs during maintenance
level: high
