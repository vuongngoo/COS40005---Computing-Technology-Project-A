title: Suspicious Windows Command Shell Execution
id: 8f3a2c91-7d64-4e12-9b53-6a1f0c82d401
status: test
description: Detects suspicious execution of Windows command shell with potentially malicious command patterns.
author: Detection Engineering Team
date: 2026-11-18
tags:
  - attack.execution
  - attack.t1059
  - attack.t1059.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\cmd.exe'
    CommandLine|contains:
      - 'whoami'
      - 'ipconfig'
      - 'net user'
  condition: selection
falsepositives:
  - Legitimate administrative activities
  - System troubleshooting scripts
level: medium