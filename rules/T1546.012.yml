title: Image File Execution Options Debugger Injection
id: d4acdeae-2c38-4dee-b11a-518981d2d31a
status: experimental
description: Detects reg.exe writing under Image File Execution Options or SilentProcessExit.
references:
  - https://attack.mitre.org/techniques/T1546/012/
author: Group 7
date: '2026-11-27'
tags:
  - attack.persistence
  - attack.privilege_escalation
  - attack.t1546.012
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: \reg.exe
    CommandLine|contains:
      - add "hklm\software\microsoft\windows nt\currentversion\image file execution options
      - add "hklm\software\microsoft\windows nt\currentversion\silentprocessexit
  condition: selection
falsepositives:
  - Developers configuring debuggers or application verifier
level: high
